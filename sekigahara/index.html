<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>関ヶ原 3D合戦図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@600;800&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0b0e13;
    --panel: rgba(11, 14, 19, 0.74);
    --panel-edge: rgba(212, 176, 106, 0.28);
    --paper: #f2ede1;
    --muted: #b9b3a5;
    --gold: #d4b06a;
    --east: #dc4a34;
    --west: #3a78dc;
    --idle: #7d8ea6;
    --serif: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --sans: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); overflow: hidden; }
  body { font: 14px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }

  #app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }

  /* ---- world labels ---- */
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels.off .ulabel, #labels.off .place { display: none; }
  .ulabel, .place, .callout { position: absolute; left: 0; top: 0; will-change: transform; white-space: nowrap; }
  .ulabel { display: flex; align-items: center; gap: 5px; padding: 2px 7px 2px 5px;
    background: rgba(8, 10, 14, .72); border-left: 3px solid var(--c, var(--west));
    font-size: 12px; line-height: 1.35; border-radius: 2px; }
  .ulabel b { font-weight: 700; letter-spacing: .02em; }
  .ulabel .num { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .ulabel .st { font-style: normal; font-size: 10.5px; padding: 0 5px; border-radius: 2px; background: #3b4250; color: #e8e3d6; }
  .ulabel .st:empty { display: none; }
  .ulabel .st[data-k="flip"] { background: var(--east); color: #fff; }
  .ulabel .st[data-k="rout"] { background: #56504a; }
  .ulabel .st[data-k="idle"] { background: #3d4a5e; }
  .ulabel .st[data-k="charge"] { background: var(--gold); color: #1a1408; }
  #labels.far .ulabel .num { display: none; }
  #labels.far .ulabel { font-size: 11px; padding: 1px 6px 1px 4px; }
  .place { font-family: var(--serif); font-weight: 600; font-size: 13px; color: #efe7d2;
    text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.8); letter-spacing: .12em; }
  .place.road { font-family: var(--sans); font-weight: 400; font-size: 11px; color: #d8cba6; letter-spacing: .08em; }
  .callout { transform-origin: 50% 100%; }
  .callout .box { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    background: rgba(12, 12, 10, .86); border: 1px solid var(--gold); color: var(--paper);
    padding: 5px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .callout .box small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
  .callout::before { content: ""; position: absolute; left: -1px; bottom: 0; width: 1px; height: 34px; background: var(--gold); }
  .callout::after { content: ""; position: absolute; left: -4px; bottom: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }

  /* ---- broadcast chrome ---- */
  .topbar { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; padding: calc(14px + env(safe-area-inset-top, 0px)) 18px 0; pointer-events: none; }
  .logo { display: flex; align-items: stretch; background: var(--panel); border: 1px solid var(--panel-edge); }
  .logo-k { font-family: var(--serif); font-weight: 800; font-size: 22px; line-height: 1; padding: 8px 12px 7px;
    background: var(--gold); color: #17120a; letter-spacing: .08em; }
  .logo-s { padding: 6px 12px; font-size: 12px; line-height: 1.35; display: flex; flex-direction: column; justify-content: center; }
  .logo-s span { color: var(--muted); font-size: 11px; }
  .clock { text-align: right; background: var(--panel); border: 1px solid var(--panel-edge); padding: 6px 12px 7px; }
  .clock .era { display: block; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .clock strong { display: block; font-family: var(--serif); font-weight: 800; font-size: 20px; line-height: 1.25; letter-spacing: .04em; }
  .clock .wx { display: inline-block; margin-top: 2px; font-size: 11px; color: #cfd7df; }

  .forces { position: absolute; right: 18px; top: calc(100px + env(safe-area-inset-top, 0px)); width: 250px;
    background: var(--panel); border: 1px solid var(--panel-edge); padding: 10px 12px 11px; pointer-events: none; }
  .forces h3 { margin: 0 0 7px; font-size: 11px; font-weight: 700; color: var(--gold); letter-spacing: .14em; }
  .bar { display: flex; height: 12px; background: #1b2029; overflow: hidden; }
  .bar i { display: block; height: 100%; transition: width .6s ease; }
  .bar .e { background: var(--east); }
  .bar .w { background: var(--west); }
  .bar .d { background: repeating-linear-gradient(135deg, #3f5a80 0 4px, #2b3a52 4px 8px); }
  .legend { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 7px; margin-top: 8px; font-size: 12px; align-items: center; }
  .legend .sw { width: 10px; height: 10px; }
  .legend .v { font-variant-numeric: tabular-nums; text-align: right; }
  .legend .sw.e { background: var(--east); } .legend .sw.w { background: var(--west); }
  .legend .sw.d { background: repeating-linear-gradient(135deg, #3f5a80 0 3px, #2b3a52 3px 6px); }

  .caption { position: absolute; left: 18px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: min(600px, calc(100% - 36px));
    background: linear-gradient(90deg, rgba(8,10,14,.9), rgba(8,10,14,.72)); border-left: 4px solid var(--gold);
    padding: 12px 18px 14px; pointer-events: none; }
  .caption .no { font-size: 11px; color: var(--gold); letter-spacing: .24em; font-weight: 700; }
  .caption h2 { margin: 2px 0 6px; font-family: var(--serif); font-weight: 800; font-size: 26px; line-height: 1.25; letter-spacing: .05em; text-wrap: balance; }
  .caption p { margin: 0; font-size: 15px; line-height: 1.75; color: #e9e3d4; max-width: 38em; }
  .caption.swap { animation: capIn .7s cubic-bezier(.2,.7,.2,1); }
  @keyframes capIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .bigtitle { position: absolute; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; opacity: 0; }
  .bigtitle .no { font-size: 13px; letter-spacing: .5em; color: var(--gold); font-weight: 700; }
  .bigtitle h1 { margin: 6px 0 0; font-family: var(--serif); font-weight: 800; font-size: clamp(34px, 6.4vw, 76px); line-height: 1.15;
    letter-spacing: .12em; text-shadow: 0 3px 24px rgba(0,0,0,.85), 0 1px 2px #000; }
  .bigtitle .rule { width: 0; height: 2px; margin: 14px auto 0; background: var(--gold); }
  .bigtitle.show { animation: bigT 3.2s ease forwards; }
  .bigtitle.show .rule { animation: rule 3.2s ease forwards; }
  @keyframes bigT { 0% { opacity: 0; transform: scale(1.06); letter-spacing: .3em; } 15% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes rule { 0% { width: 0; } 30% { width: 220px; } 100% { width: 220px; } }

  .controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 18px calc(12px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(0deg, rgba(6,8,11,.92) 30%, rgba(6,8,11,0)); display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn { height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); border-radius: 3px; cursor: pointer; font-size: 13px; }
  .btn:hover { background: rgba(255,255,255,.14); }
  .btn:focus-visible, .seg:focus-visible, #scrub:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn svg { width: 16px; height: 16px; fill: currentColor; }
  .btn.play { background: var(--gold); color: #17120a; border-color: var(--gold); min-width: 44px; }
  .btn[aria-pressed="true"] { background: rgba(212,176,106,.22); border-color: var(--gold); }
  .spacer { flex: 1; }
  .tc { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); min-width: 84px; }
  .speed { display: inline-flex; }
  .speed .btn { border-radius: 0; margin-left: -1px; padding: 0 9px; }
  .speed .btn:first-child { border-radius: 3px 0 0 3px; } .speed .btn:last-child { border-radius: 0 3px 3px 0; }
  .timeline { position: relative; height: 26px; }
  .segs { position: absolute; inset: 0; display: flex; gap: 2px; }
  .seg { position: relative; height: 100%; background: rgba(255,255,255,.08); border: 0; padding: 0 6px; cursor: pointer; overflow: hidden;
    font-size: 11px; color: #cfc8b8; text-align: left; white-space: nowrap; text-overflow: ellipsis; }
  .seg .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(212,176,106,.35); pointer-events: none; }
  .seg span { position: relative; }
  .seg.cur { color: #fff; box-shadow: inset 0 -2px 0 var(--gold); }
  #scrub { position: absolute; left: 0; right: 0; bottom: -8px; width: 100%; margin: 0; height: 12px; opacity: 0; cursor: pointer; }

  .note { position: absolute; left: 18px; top: calc(76px + env(safe-area-inset-top, 0px)); font-size: 11px; color: rgba(242,237,225,.62);
    pointer-events: none; max-width: 330px; line-height: 1.5; }

  .intro { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(ellipse at 50% 60%, rgba(11,14,19,.35), rgba(11,14,19,.92)); text-align: center; }
  .intro[hidden] { display: none !important; }
  .intro .inner { max-width: 640px; }
  .intro .kicker { font-size: 12px; letter-spacing: .4em; color: var(--gold); font-weight: 700; }
  .intro h1 { margin: 10px 0 4px; font-family: var(--serif); font-weight: 800; font-size: clamp(56px, 13vw, 128px); line-height: 1; letter-spacing: .14em;
    text-shadow: 0 6px 40px rgba(0,0,0,.9); }
  .intro .sub { font-family: var(--serif); font-size: clamp(16px, 2.6vw, 22px); letter-spacing: .2em; }
  .intro .meta { margin: 14px 0 22px; color: var(--muted); font-size: 13px; }
  .intro .go { height: 48px; padding: 0 30px; font-size: 16px; font-weight: 700; letter-spacing: .1em; }
  .intro .hint { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.9; }
  kbd { font: 11px var(--sans); border: 1px solid rgba(255,255,255,.3); border-radius: 3px; padding: 0 5px; }

  .err { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 15px; }

  @media (max-width: 760px) {
    .forces { left: 16px; right: 16px; width: auto; top: calc(104px + env(safe-area-inset-top, 0px)); padding: 7px 10px 8px; }
    .forces h3, .legend { display: none; }
    .note { display: none; }
    .topbar { padding-inline: 16px; }
    .logo-k { font-size: 18px; padding: 7px 9px 6px; }
    .logo-s { display: none; }
    .clock strong { font-size: 16px; }
    .caption { left: 16px; width: calc(100% - 32px); bottom: calc(136px + env(safe-area-inset-bottom, 0px)); padding: 9px 12px 10px; }
    .caption h2 { font-size: 19px; margin-bottom: 3px; }
    .caption p { font-size: 13px; line-height: 1.6; }
    .controls { padding-inline: 16px; }
    .seg span { display: none; }
    .tc { display: none; }
    .ulabel .num { display: none; }
  }
  @media (max-height: 520px) {
    .caption p { display: none; }
    .forces { display: none; }
    .caption { bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .caption.swap, .bigtitle.show, .bigtitle.show .rule { animation-duration: .01s; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="関ヶ原の地形と両軍の布陣を示す3D画面"></canvas>
  <div class="vignette"></div>
  <div id="labels"></div>

  <header class="topbar">
    <div class="logo"><div class="logo-k">関ヶ原</div><div class="logo-s">天下分け目の合戦<span>3D俯瞰合戦図</span></div></div>
    <div class="clock"><span class="era">慶長5年（1600年）</span><strong id="clock">9月15日 未明</strong><span class="wx" id="wx">雨</span></div>
  </header>

  <aside class="forces" aria-label="兵力">
    <h3>兵力（通説）</h3>
    <div class="bar"><i class="e" id="barE"></i><i class="w" id="barW"></i><i class="d" id="barD"></i></div>
    <div class="legend">
      <span class="sw e"></span><span>東軍</span><span class="v" id="numE">0</span>
      <span class="sw w"></span><span>西軍（戦う）</span><span class="v" id="numW">0</span>
      <span class="sw d"></span><span>西軍（動かない）</span><span class="v" id="numD">0</span>
    </div>
  </aside>
  <p class="note">兵数・布陣位置・時刻は通説にもとづく目安です（諸説あり）。地形は高さを強調した模式図です。</p>

  <div class="bigtitle" id="big"><div class="no" id="bigNo"></div><h1 id="bigT"></h1><div class="rule"></div></div>

  <section class="caption" id="cap" aria-live="polite">
    <div class="no" id="capNo"></div>
    <h2 id="capT"></h2>
    <p id="capP"></p>
  </section>

  <nav class="controls" aria-label="再生操作">
    <div class="timeline">
      <div class="segs" id="segs"></div>
      <input id="scrub" type="range" min="0" max="100" step="0.01" value="0" aria-label="再生位置">
    </div>
    <div class="row">
      <button class="btn" id="bPrev" title="前の場面（←）" aria-label="前の場面"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="btn play" id="bPlay" title="再生／一時停止（スペース）" aria-label="再生"><svg viewBox="0 0 24 24" id="icoPlay"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="btn" id="bNext" title="次の場面（→）" aria-label="次の場面"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
      <span class="tc" id="tc">0:00 / 0:00</span>
      <span class="spacer"></span>
      <span class="speed" role="group" aria-label="再生速度">
        <button class="btn" data-sp="0.5" aria-pressed="false">0.5×</button>
        <button class="btn" data-sp="1" aria-pressed="true">1×</button>
        <button class="btn" data-sp="2" aria-pressed="false">2×</button>
      </span>
      <button class="btn" id="bLab" aria-pressed="true">名前</button>
      <button class="btn" id="bFog" aria-pressed="true">霧</button>
      <button class="btn" id="bCam" aria-pressed="false" title="オンにするとカメラが自動で動かなくなります">自由視点</button>
      <button class="btn" id="bFull" title="全画面" aria-label="全画面"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
    </div>
  </nav>

  <div class="intro" id="intro">
    <div class="inner">
      <div class="kicker">慶長五年九月十五日</div>
      <h1>関ヶ原</h1>
      <div class="sub">天下分け目の合戦を、空から見る</div>
      <div class="meta">1600年10月21日　美濃国 関ヶ原　／　約2分40秒・全11場面</div>
      <button class="btn play go" id="bGo">▶ 上映をはじめる</button>
      <div class="hint">ドラッグで視点を回転、ホイール・ピンチで拡大縮小<br><kbd>Space</kbd> 一時停止　<kbd>←</kbd><kbd>→</kbd> 場面の移動</div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const app = document.getElementById('app');
if (!window.THREE) { app.innerHTML = '<div class="err">3D表示用のライブラリを読み込めませんでした。ネットワーク接続を確認して再読み込みしてください。</div>'; return; }

/* ============================================================
   Timeline
   ============================================================ */
const D = [12, 16, 14, 14, 18, 12, 10, 16, 14, 16, 14];
const S = []; let TOTAL = 0; for (const d of D) { S.push(TOTAL); TOTAL += d; }
const C = (i, f = 0) => S[i] + f * D[i];

const CHAPTERS = [
  { no: '序章', t: '天下分け目の関ヶ原', clock: '9月14日 夜', wx: '雨',
    p: '豊臣秀吉の死後、徳川家康（東軍）と石田三成ら（西軍）が対立した。美濃国・関ヶ原の小さな盆地に、両軍あわせて約15万の大軍が集まろうとしている。' },
  { no: '第一幕', t: '西軍、関ヶ原へ先回り', clock: '9月15日 未明', wx: '雨',
    p: '大垣城にいた石田三成らは、雨の夜に南宮山の南を回って関ヶ原へ移動。西側の山すそに陣を構え、東から来る敵を待ち受けた。松尾山の小早川秀秋、南宮山の毛利勢はすでに陣取っていた。' },
  { no: '第二幕', t: '東軍、追って布陣', clock: '9月15日 早朝', wx: '霧',
    p: '西軍の動きを知った家康は、中山道を西へ進んで関ヶ原に入る。福島正則・黒田長政らの先鋒が西軍の正面に並び、家康の本陣は桃配山に置かれた。南宮山の毛利勢には浅野・池田らが備えた。' },
  { no: '第三幕', t: '霧の中の開戦', clock: '午前8時ごろ', wx: '濃い霧',
    p: '盆地は深い霧に包まれていた。霧が薄れはじめたころ、井伊直政・松平忠吉の隊が宇喜多隊に向けて発砲。続いて福島正則隊が宇喜多隊に突入し、戦いが始まった。' },
  { no: '第四幕', t: '一進一退の激戦', clock: '午前9時〜11時ごろ', wx: '霧が晴れる',
    p: '黒田・細川らは笹尾山の石田隊へ、藤堂・京極は大谷隊へ攻めかかる。高い所に陣取った西軍はよく戦い、宇喜多隊が福島隊を押し返す場面もあった。一方、島津隊はほとんど動かなかった。' },
  { no: '第五幕', t: '動かない南宮山', clock: '午前中', wx: '晴れ',
    p: '東軍の背後をつける位置にいた南宮山の毛利秀元は、最後まで山を下りなかった。ふもとの吉川広家がひそかに家康と通じ、道をふさいでいたからである（「宰相殿の空弁当」の逸話）。' },
  { no: '第六幕', t: '家康、本陣を前へ', clock: '午前11時ごろ', wx: '晴れ',
    p: 'なかなか決着がつかないことにいらだった家康は、本陣を桃配山から陣場野へ進め、前線の近くで指揮をとった。' },
  { no: '第七幕', t: '小早川秀秋の寝返り', clock: '正午ごろ', wx: '晴れ',
    p: '松尾山の小早川秀秋（約1万5千）が西軍を裏切り、山を下って大谷吉継隊に襲いかかる。続いて脇坂・朽木・小川・赤座の4隊も寝返った。家康が鉄砲を撃ちかけて決断をせまった「問鉄砲」の話は有名だが、近年は疑問視されている。' },
  { no: '第八幕', t: '西軍、総崩れ', clock: '午後1時〜2時ごろ', wx: '晴れ',
    p: '側面をつかれた大谷隊は壊滅し、吉継は自害。小西隊・宇喜多隊も総崩れとなり、石田三成は伊吹山の方へ落ちのびた。' },

  for (let i = 0; i < pos.count; i++) pos.setY(i, H(pos.getX(i), pos.getZ(i)));

  const col = new Float32Array(pos.count * 3);
  const FIELD = ['#b39a57', '#a48d4f', '#8a8849', '#9f9458', '#b7a268', '#7f8346'].map(c => new THREE.Color(c));
  const FOREST = [new THREE.Color('#2c4528'), new THREE.Color('#37552f'), new THREE.Color('#415f34')];
  const AUTUMN = [new THREE.Color('#7a5a2a'), new THREE.Color('#8c4526'), new THREE.Color('#9a7a33')];

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), h = pos.getY(i), ny = nrm.getY(i);
    const wob = fbm(x * 0.3, z * 0.3);
    const fx = x / 2.3 + wob * 0.6, fz = z / 1.7 + wob * 0.4;
    f.copy(FIELD[Math.floor(hash2(Math.floor(fx), Math.floor(fz)) * FIELD.length)]);
    const edge = Math.min(fx - Math.floor(fx), fz - Math.floor(fz));
    if (edge < 0.07) f.multiplyScalar(0.82);
    f.multiplyScalar(0.92 + 0.16 * wob);

    c.copy(FOREST[Math.floor(n * 2.99)]);
    const au = fbm(x * 0.6 - 20, z * 0.6 + 7);
    if (au > 0.6) c.lerp(AUTUMN[Math.floor(hash2(Math.floor(x * 2), Math.floor(z * 2)) * 3)], ss(0.6, 0.72, au) * 0.7);
    c.multiplyScalar(0.85 + 0.3 * wob);

function ribbon(pts2, width, color, lift, opacity = 1) {
  const curve = new THREE.CatmullRomCurve3(pts2.map(p => new THREE.Vector3(p[0], 0, p[1])), false, 'centripetal');
  const L = curve.getLength(), N = Math.ceil(L * 2.5);
  const pts = curve.getSpacedPoints(N);
  const pos = new Float32Array((N + 1) * 6), idx = [];
  for (let i = 0; i <= N; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N, i + 1)];
    let tx = b.x - a.x, tz = b.z - a.z; const l = Math.hypot(tx, tz) || 1; tx /= l; tz /= l;
    const p = pts[i], nx = -tz * width / 2, nz = tx * width / 2;
    const y1 = H(p.x + nx, p.z + nz) + lift, y2 = H(p.x - nx, p.z - nz) + lift;
    pos.set([p.x + nx, y1, p.z + nz, p.x - nx, y2, p.z - nz], i * 6);
    if (i < N) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setIndex(idx);
  const m = new THREE.MeshBasicMaterial({ color, transparent: opacity < 1, opacity, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(g, m); scene.add(mesh); return mesh;
}

function route(all, t0, t1) {
  const L = [0];
  for (let i = 1; i < all.length; i++) L.push(L[i - 1] + Math.hypot(all[i][0] - all[i - 1][0], all[i][1] - all[i - 1][1]));
  const tot = L[L.length - 1] || 1;

}

      if (showLabels && project(tmpV, u.el, ' translate(-8%,-100%)')) {
        const cc = u.cache;
        if (cc.side !== side || cc.idle !== idle) { u.el.style.setProperty('--c', side === 'E' ? '#dc4a34' : idle ? '#6c83a3' : '#3a78dc'); cc.side = side; cc.idle = idle; }
        const num = fmtN(Math.round(live / 100) * 100); if (cc.num !== num) { u.elNum.textContent = num; cc.num = num; }
        const st = statusAt(u, t), stt = st ? st[1] : '', stk = st ? st[2] : '';
        if (cc.st !== stt) { u.elSt.textContent = stt; u.elSt.dataset.k = stk; cc.st = stt; }
        u.el.style.opacity = clamp(fr * 4, 0, 1);
      }
    } else if (u.el._v !== 0) { u.el.style.display = 'none'; u.el._v = 0; }
    if (!showLabels && u.el._v !== 0) { u.el.style.display = 'none'; u.el._v = 0; }
  }

  // forces bar
  const tot = sumE + sumW + sumD || 1;
  $('barE').style.width = (sumE / tot * 100) + '%'; $('barW').style.width = (sumW / tot * 100) + '%'; $('barD').style.width = (sumD / tot * 100) + '%';
  $('numE').textContent = fmtN(Math.round(sumE / 100) * 100); $('numW').textContent = fmtN(Math.round(sumW / 100) * 100); $('numD').textContent = fmtN(Math.round(sumD / 100) * 100);

  // arrows, rings, particles
  for (const a of ARROWS) a.update(t, clock);
  for (const r of RINGS) {
    const on = t >= r.t0 && t < r.t1; r.m.visible = on; if (!on) continue;
    const ph = (clock * 0.8) % 1; r.m.scale.setScalar(r.r * (0.6 + ph * 0.8));
    r.m.material.opacity = (1 - ph) * ss(r.t0, r.t0 + 0.4, t) * (1 - ss(r.t1 - 0.5, r.t1, t));
  }
  updateParticles(t, clock);

  // places & callouts
  for (const p of PLACES) { if (showLabels) project(p.v, p.el, ' translate(-50%,-50%)'); }
  for (const c of CALLOUTS) {
    const on = t >= c.t0 && t < c.t1;
    if (!on || !project(c.v, c.el)) { if (c.el._v !== 0) { c.el.style.display = 'none'; c.el._v = 0; } continue; }
    c.el.style.opacity = ss(c.t0, c.t0 + 0.4, t) * (1 - ss(c.t1 - 0.4, c.t1, t));
  }

  renderer.render(scene, camera);
}
