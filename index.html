<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="天気と予定に合わせて、手持ちの服から今日のコーデを提案するアプリ">
  <meta name="theme-color" content="#fbcfe8">
  <title>コーデガチャ - ファッション提案アプリ</title>

  <!-- Tailwind CSS (※Play CDN は本番非推奨。将来はビルド版へ差し替える) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons (バージョン固定：@latest は破壊的変更で突然壊れるため) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <style>
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .animate-pulse-slow { animation: pulse-slow 3s infinite ease-in-out; }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow { animation: spin-slow 1.5s linear infinite; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }

    @keyframes slide-up-fade {
      0% { opacity: 0; transform: translate(-50%, 20px); }
      10% { opacity: 1; transform: translate(-50%, 0); }
      90% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }
    .animate-toast { animation: slide-up-fade 3s ease-in-out forwards; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 非表示画面がフォーカス／読み上げを奪わないようにする */
    [inert] { pointer-events: none; }

    @media (prefers-reduced-motion: reduce) {
      .animate-pulse-slow, .animate-spin-slow, .animate-fade-in, .animate-toast {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body class="bg-pink-200 flex items-center justify-center min-h-screen font-sans text-gray-800">

  <!-- スマホサイズのコンテナ -->
  <div id="app-frame" class="relative w-full max-w-[400px] h-[800px] max-h-screen bg-pink-50 overflow-hidden shadow-2xl sm:rounded-[2.5rem] sm:border-8 border-gray-900 flex flex-col">

    <!-- =========================================
         トップ画面 (Home)
         ========================================= -->
    <div id="home-screen" class="relative flex-1 w-full h-full p-5 flex flex-col justify-between items-center">

      <!-- 上部エリア（左上・右上） -->
      <div class="w-full flex justify-between items-start z-10 gap-2">
        <!-- 【左上】カレンダー -->
        <button data-action="open-calendar" class="flex-1 max-w-[48%] flex flex-col bg-white p-2.5 rounded-2xl shadow-sm border border-gray-100 active:scale-95 transition-transform text-left">
          <div class="flex items-center gap-1.5 text-rose-500 font-bold mb-0.5">
            <i data-lucide="calendar" class="w-4 h-4 shrink-0"></i>
            <span id="home-calendar-date-text" class="text-xs">--/--</span>
          </div>
          <div id="home-schedule-text" class="text-[11px] text-gray-500 font-medium truncate w-full">
            読み込み中...
          </div>
          <div id="home-decided-badge" class="hidden text-[10px] text-pink-600 font-bold items-center gap-1 mt-1">
            <i data-lucide="sparkles" class="w-3 h-3"></i><span>コーデ決定済み</span>
          </div>
        </button>

        <!-- 【右上】天気予報 (現在地連携対応) -->
        <button data-action="refresh-weather" title="タップして天気を更新" aria-label="天気を更新" class="flex-1 max-w-[48%] flex items-center justify-between gap-2 bg-gradient-to-br from-orange-50 to-orange-100 p-2.5 rounded-2xl shadow-sm border border-orange-200 active:scale-95 transition-transform text-left">
          <div id="weather-icon-container" class="shrink-0 text-orange-500">
            <i data-lucide="sun" class="w-6 h-6"></i>
          </div>
          <div class="flex flex-col items-end min-w-0 flex-1">
            <span id="weather-temp" class="text-lg font-black leading-none text-gray-800">--°</span>
            <span id="weather-desc" class="text-[10px] text-gray-600 font-medium mt-1 truncate w-full text-right">天気取得中...</span>
          </div>
        </button>
      </div>

      <!-- 中央エリア（コーデガチャ） -->
      <div class="my-auto py-2 flex flex-col items-center justify-center z-10">
        <button id="gacha-btn" data-action="start-gacha" class="relative group flex items-center justify-center w-48 h-48 sm:w-52 sm:h-52 rounded-full shadow-[0_20px_50px_rgba(236,72,153,0.3)] bg-gradient-to-tr from-pink-500 via-purple-500 to-indigo-500 active:scale-95 transition-all duration-300 hover:scale-105 animate-pulse-slow">

          <div class="absolute inset-2 rounded-full border-4 border-white/20"></div>

          <div class="flex flex-col items-center text-white">
            <div id="icon-wand" class="mb-1 group-hover:rotate-12 transition-transform">
              <i data-lucide="wand-2" class="w-12 h-12"></i>
            </div>

            <div id="icon-spinner" class="mb-1 animate-spin hidden">
              <i data-lucide="refresh-ccw" class="w-10 h-10"></i>
            </div>

            <span id="gacha-text" class="text-xl font-black tracking-wider">コーデガチャ</span>
            <span id="gacha-subtext" class="text-[10px] font-medium opacity-80 mt-0.5">TAP TO SPIN</span>
          </div>
        </button>

        <p class="mt-4 text-xs font-medium text-gray-500 text-center px-4 leading-relaxed">
          今日の天気と予定に合わせて<br>あなたの服から自動提案します
        </p>
      </div>

      <!-- 下部エリア（左下・右下） -->
      <div class="w-full flex justify-between items-end z-10 pb-2">
        <button data-action="open-closet" class="flex flex-col items-center gap-2 bg-white/80 backdrop-blur p-4 rounded-3xl shadow-lg border border-gray-100 active:scale-95 transition-transform w-[110px]">
          <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center">
            <i data-lucide="camera" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-bold text-gray-700">クローゼット</span>
        </button>

        <button data-action="open-shop" class="flex flex-col items-center gap-2 bg-white/80 backdrop-blur p-4 rounded-3xl shadow-lg border border-gray-100 active:scale-95 transition-transform w-[110px]">
          <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center">
            <i data-lucide="shopping-bag" class="w-6 h-6"></i>
          </div>
          <span class="text-xs font-bold text-gray-700">服屋を探す</span>
        </button>
      </div>
    </div>


    <!-- =========================================
         提案結果画面 (Result)
         ========================================= -->
    <div id="result-screen" class="absolute inset-0 bg-white z-50 flex flex-col animate-fade-in hidden">
      <div class="p-4 flex items-center border-b border-gray-100">
        <button data-action="back" aria-label="戻る" class="p-2 -ml-2 text-gray-500 active:bg-gray-100 rounded-full transition-colors">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h2 class="text-lg font-bold mx-auto pr-8">今日の提案コーデ</h2>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar p-6 flex flex-col gap-6">

        <!-- 提案理由メッセージ（JSが生成） -->
        <div id="result-message" class="bg-pink-50 text-pink-700 p-4 rounded-2xl text-sm font-medium leading-relaxed"></div>

        <!-- コーディネートアイテム一覧（JSが生成） -->
        <div id="result-items" class="flex flex-col gap-4"></div>

        <!-- おすすめアイテム（ショップ連携） -->
        <div class="mt-2 border-t border-gray-100 pt-6">
          <h3 class="text-sm font-bold text-gray-600 mb-3 flex items-center gap-2">
            <i data-lucide="map-pin" class="w-4 h-4"></i> このコーデに合う小物を探す
          </h3>
          <button data-action="open-shop" class="w-full text-left bg-gradient-to-r from-emerald-500 to-teal-500 p-4 rounded-2xl text-white flex justify-between items-center shadow-md active:scale-95 transition-transform">
            <div>
              <p class="font-bold">サコッシュバッグ</p>
              <p class="text-xs opacity-90 mt-1">近くの店舗で取扱中</p>
            </div>
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <div class="p-4 bg-white border-t border-gray-100 flex gap-3 pb-8">
        <button data-action="regacha" class="flex-1 py-4 bg-gray-100 text-gray-700 font-bold rounded-2xl active:bg-gray-200 transition-colors flex items-center justify-center gap-2">
          <i data-lucide="refresh-ccw" class="w-4 h-4"></i> やり直す
        </button>
        <button data-action="decide-outfit" class="flex-1 py-4 bg-gray-900 text-white font-bold rounded-2xl active:bg-gray-800 transition-colors flex items-center justify-center gap-2 shadow-lg">
          <i data-lucide="check" class="w-4 h-4"></i> これを着る
        </button>
      </div>
    </div>

    <!-- =========================================
         マイクローゼット画面 (Closet)
         ========================================= -->
    <div id="closet-screen" class="absolute inset-0 bg-white z-50 flex flex-col animate-fade-in hidden">
      <div class="p-4 flex items-center justify-between border-b border-gray-100">
        <button data-action="back" aria-label="戻る" class="p-2 -ml-2 text-gray-500 active:bg-gray-100 rounded-full transition-colors">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h2 class="text-lg font-bold">マイクローゼット</h2>
        <button data-action="open-camera" aria-label="服を追加" class="p-2 -mr-2 text-blue-500 active:bg-blue-50 rounded-full transition-colors">
          <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- タブナビゲーション -->
      <div class="flex border-b border-gray-100 px-4" role="tablist">
        <button role="tab" aria-selected="true" aria-controls="content-tops" data-action="switch-tab" data-tab="tops" id="tab-tops" class="flex-1 py-3 text-sm font-bold border-b-2 border-gray-900 text-gray-900 transition-colors">Tops</button>
        <button role="tab" aria-selected="false" aria-controls="content-bottoms" data-action="switch-tab" data-tab="bottoms" id="tab-bottoms" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500 transition-colors">Bottoms</button>
        <button role="tab" aria-selected="false" aria-controls="content-shoes" data-action="switch-tab" data-tab="shoes" id="tab-shoes" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500 transition-colors">Shoes</button>
      </div>

      <!-- アイテム一覧エリア（JSが生成） -->
      <div class="flex-1 overflow-y-auto no-scrollbar p-4 bg-gray-50">
        <div id="content-tops" role="tabpanel" aria-labelledby="tab-tops" class="grid grid-cols-2 gap-4"></div>
        <div id="content-bottoms" role="tabpanel" aria-labelledby="tab-bottoms" class="grid grid-cols-2 gap-4 hidden"></div>
        <div id="content-shoes" role="tabpanel" aria-labelledby="tab-shoes" class="grid grid-cols-2 gap-4 hidden"></div>
      </div>
    </div>

    <!-- =========================================
         ショップ情報画面 (Shop)
         ========================================= -->
    <div id="shop-screen" class="absolute inset-0 bg-white z-50 flex flex-col animate-fade-in hidden">
      <div class="p-4 flex items-center border-b border-gray-100">
        <button data-action="back" aria-label="戻る" class="p-2 -ml-2 text-gray-500 active:bg-gray-100 rounded-full transition-colors">
          <i data-lucide="chevron-left" class="w-6 h-6"></i>
        </button>
        <h2 class="text-lg font-bold mx-auto pr-8">周辺の服屋</h2>
      </div>

      <div class="flex-1 overflow-y-auto no-scrollbar p-4 bg-gray-50 flex flex-col gap-4">

        <!-- 店舗1: minami -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-gray-800 text-base">minami</h3>
              <p class="text-xs text-gray-500 mt-1 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> 2.7 km 先</p>
            </div>
            <span class="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded-full">営業中</span>
          </div>

          <div class="flex gap-3 overflow-x-auto no-scrollbar py-1">
            <div class="flex-shrink-0 w-20 flex flex-col items-center gap-1">
              <div class="w-20 h-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-100">
                <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=200&q=80" alt="ルーズシャツ" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" data-fallback="https://placehold.co/200x200/e2e8f0/475569?text=Shirt">
              </div>
              <span class="text-[11px] font-bold text-gray-700 truncate w-full text-center">ルーズシャツ</span>
              <span class="text-[10px] text-pink-600 font-bold">¥4,900</span>
            </div>
            <div class="flex-shrink-0 w-20 flex flex-col items-center gap-1">
              <div class="w-20 h-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-100">
                <img src="https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=200&q=80" alt="ニットベスト" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" data-fallback="https://placehold.co/200x200/e2e8f0/475569?text=Knit">
              </div>
              <span class="text-[11px] font-bold text-gray-700 truncate w-full text-center">ニットベスト</span>
              <span class="text-[10px] text-pink-600 font-bold">¥5,500</span>
            </div>
            <div class="flex-shrink-0 w-20 flex flex-col items-center gap-1">
              <div class="w-20 h-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-100">
                <img src="https://images.unsplash.com/photo-1582552938357-32b906df40cb?auto=format&fit=crop&w=200&q=80" alt="デニムスカート" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" data-fallback="https://placehold.co/200x200/e2e8f0/475569?text=Skirt">
              </div>
              <span class="text-[11px] font-bold text-gray-700 truncate w-full text-center">デニムスカート</span>
              <span class="text-[10px] text-pink-600 font-bold">¥6,800</span>
            </div>
          </div>

          <div class="flex justify-between items-center mt-1 pt-3 border-t border-gray-50">
            <div class="text-xs text-gray-500 flex flex-col gap-1">
              <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> 10:00〜19:00</span>
            </div>
            <a href="https://saijo.mypl.net/shop/00000379236/" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 bg-gray-900 text-white text-xs font-bold rounded-xl active:bg-gray-700 flex items-center gap-1">
              詳細 <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          </div>
        </div>

        <!-- 店舗2: キャマラド -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col gap-3">
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-gray-800 text-base">キャマラド</h3>
              <p class="text-xs text-gray-500 mt-1 flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> 2.0 km 先</p>
            </div>
            <span class="px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded-full">営業中</span>
          </div>

          <div class="flex gap-3 overflow-x-auto no-scrollbar py-1">
            <div class="flex-shrink-0 w-20 flex flex-col items-center gap-1">
              <div class="w-20 h-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-100">
                <img src="https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&w=200&q=80" alt="ワンピース" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" data-fallback="https://placehold.co/200x200/e2e8f0/475569?text=Dress">
              </div>
              <span class="text-[11px] font-bold text-gray-700 truncate w-full text-center">ワンピース</span>
              <span class="text-[10px] text-pink-600 font-bold">¥8,900</span>
            </div>
            <div class="flex-shrink-0 w-20 flex flex-col items-center gap-1">
              <div class="w-20 h-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-100">
                <img src="https://images.unsplash.com/photo-1564257631407-4deb1f99d992?auto=format&fit=crop&w=200&q=80" alt="ブラウス" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" data-fallback="https://placehold.co/200x200/e2e8f0/475569?text=Blouse">
              </div>
              <span class="text-[11px] font-bold text-gray-700 truncate w-full text-center">ブラウス</span>
              <span class="text-[10px] text-pink-600 font-bold">¥6,000</span>
            </div>
            <div class="flex-shrink-0 w-20 flex flex-col items-center gap-1">
              <div class="w-20 h-20 rounded-xl overflow-hidden border border-gray-200 shadow-sm bg-gray-100">
                <img src="https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=200&q=80" alt="カーディガン" loading="lazy" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300" data-fallback="https://placehold.co/200x200/e2e8f0/475569?text=Cardigan">
              </div>
              <span class="text-[11px] font-bold text-gray-700 truncate w-full text-center">カーディガン</span>
              <span class="text-[10px] text-pink-600 font-bold">¥7,200</span>
            </div>
          </div>

          <div class="flex justify-between items-center mt-1 pt-3 border-t border-gray-50">
            <div class="text-xs text-gray-500 flex flex-col gap-1">
              <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> 11:00〜18:00</span>
            </div>
            <a href="https://instagram.com/0125camarade/" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 bg-gray-900 text-white text-xs font-bold rounded-xl active:bg-gray-700 flex items-center gap-1">
              詳細 <i data-lucide="external-link" class="w-3 h-3"></i>
            </a>
          </div>
        </div>

      </div>
    </div>

    <!-- =========================================
         カメラ・服追加画面 (Camera)
         ========================================= -->
    <div id="camera-screen" class="absolute inset-0 bg-gray-900 z-[60] flex flex-col animate-fade-in hidden">
      <div id="camera-flash" class="absolute inset-0 bg-white z-20 pointer-events-none opacity-0"></div>

      <div class="relative flex-1 bg-black overflow-hidden flex flex-col">
        <video id="camera-video" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>
        <canvas id="camera-canvas" class="hidden"></canvas>

        <!-- カメラ起動失敗時のメッセージ -->
        <div id="camera-error" class="absolute inset-0 z-10 hidden flex-col items-center justify-center gap-3 p-8 text-center bg-gray-900">
          <i data-lucide="camera-off" class="w-10 h-10 text-gray-500"></i>
          <p id="camera-error-text" class="text-sm text-gray-300 font-medium leading-relaxed"></p>
        </div>

        <div class="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-10 bg-gradient-to-b from-black/50 to-transparent">
          <button data-action="close-camera" aria-label="閉じる" class="p-2 text-white active:bg-white/20 rounded-full transition-colors">
            <i data-lucide="x" class="w-6 h-6"></i>
          </button>
          <div class="text-white font-medium text-sm">服を追加</div>
          <div class="w-10"></div>
        </div>

        <div id="camera-guide" class="absolute inset-0 flex items-center justify-center p-8 pointer-events-none z-10">
          <div class="w-full aspect-[3/4] max-h-[60%] border-2 border-dashed border-white/50 rounded-3xl flex items-center justify-center">
            <p class="text-white/70 text-xs font-medium bg-black/40 px-3 py-1.5 rounded-full backdrop-blur-sm">
              枠内に服を収めて撮影してください
            </p>
          </div>
        </div>
      </div>

      <div id="camera-shutter-bar" class="h-32 bg-black flex items-center justify-center relative z-10 px-8 pb-4">
        <button data-action="take-photo" aria-label="撮影" class="w-20 h-20 rounded-full border-4 border-white flex items-center justify-center active:scale-95 transition-transform">
          <div class="w-16 h-16 rounded-full bg-white active:bg-gray-200"></div>
        </button>
      </div>

      <!-- 撮影後の登録フォーム（ガチャの判定に使う属性をここで入力する） -->
      <div id="capture-form" class="absolute inset-0 z-30 hidden flex-col bg-white animate-fade-in">
        <div class="p-4 flex items-center border-b border-gray-100">
          <button data-action="cancel-capture" aria-label="撮り直す" class="p-2 -ml-2 text-gray-500 active:bg-gray-100 rounded-full transition-colors">
            <i data-lucide="chevron-left" class="w-6 h-6"></i>
          </button>
          <h2 class="text-lg font-bold mx-auto pr-8">アイテムを登録</h2>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar p-5 flex flex-col gap-4">
          <div class="w-32 h-32 mx-auto rounded-2xl overflow-hidden border border-gray-200 shadow-sm bg-gray-100">
            <img id="capture-preview" alt="撮影した服のプレビュー" class="w-full h-full object-cover">
          </div>

          <label class="flex flex-col gap-1.5">
            <span class="text-xs font-bold text-gray-700">アイテム名</span>
            <input id="capture-name" type="text" maxlength="40" placeholder="例: 白のオーバーサイズT"
              class="border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-800 bg-gray-50 focus:outline-none focus:border-rose-400">
          </label>

    <!-- トースト通知（コンテナ基準に配置） -->

      <span id="toast-text" class="text-sm font-bold"></span>

  </div>

  <script>
  'use strict';

  /* ============================================================
     0. 小さなユーティリティ
     ============================================================ */

  // DOM構築ヘルパー。テキストは必ず textContent で入れるため、
  // ユーザー入力が HTML として解釈されることがない（XSS対策）。
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === null || value === undefined || value === false) continue;
      if (key === 'class') el.className = value;
      else if (key === 'text') el.textContent = value;
      else el.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return el;
  }

  const $ = (id) => document.getElementById(id);

  function newId() {
    if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
  }

  const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

  /** Date -> 'YYYY-MM-DD'（ローカルタイム基準。toISOString はUTCずれを起こすので使わない） */
  function toDateKey(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  /** 'YYYY-MM-DD' -> Date */
  function fromDateKey(key) {
    const [y, m, d] = key.split('-').map((n) => parseInt(n, 10));
    return new Date(y, m - 1, d);
  }

  function formatDateKeyJa(key, withWeekday = true) {
    const date = fromDateKey(key);
    const base = `${date.getMonth() + 1}月${date.getDate()}日`;
    return withWeekday ? `${base} (${WEEKDAYS[date.getDay()]})` : base;
  }

  /* ============================================================
     1. データ層
     --------------------------------------------------------
     ★ Firebase 差し替えはこのセクションだけで完結する。
       - 呼び出し側は全て Promise を await しているので、
         ローカル実装を Firestore / Cloud Storage 実装に置き換えるだけでよい。
       - ドキュメント形状はそのまま Firestore のコレクション設計になる：
           closetItems/{itemId}
             { userId, category, name, imageUrl, warmth, formality,
               rainSafe, colorClass, createdAt }
           schedules/{scheduleId}
             { userId, date: 'YYYY-MM-DD', time: 'HH:MM'|'終日', title, createdAt }
           outfits/{outfitId}
             { userId, date, topsId, bottomsId, shoesId, decidedAt }
       - imageUrl は現在 data URL を保持しているが、Firebase 移行時は
         Cloud Storage にアップロードした downloadURL を入れれば
         レンダリング側は無変更で動く（どちらも <img src> に渡すだけ）。
       - userId は現在 'local' 固定。Firebase Auth 導入時に uid を入れる。
     ============================================================ */

  const DB_NAME = 'coordi-gacha';
  const DB_VERSION = 1;
  const STORE_CLOSET = 'closetItems';
  const STORE_SCHEDULES = 'schedules';
  const STORE_OUTFITS = 'outfits';
  const ALL_STORES = [STORE_CLOSET, STORE_SCHEDULES, STORE_OUTFITS];

  const CURRENT_USER_ID = 'local'; // TODO(firebase): auth.currentUser.uid

  /**
   * IndexedDB バックエンド。
   * プライベートブラウジング等で IndexedDB が使えない環境では
   * メモリ上のフォールバックに自動で切り替わる（アプリを落とさない）。
   */
  function createLocalBackend() {
    let dbPromise = null;
    let useMemory = false;
    const memory = new Map(ALL_STORES.map((name) => [name, new Map()]));

    function openDB() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) {
          reject(new Error('IndexedDB is unavailable'));
          return;
        }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const db = request.result;
          for (const name of ALL_STORES) {
            if (!db.objectStoreNames.contains(name)) {
              db.createObjectStore(name, { keyPath: 'id' });
            }
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        request.onblocked = () => reject(new Error('IndexedDB is blocked'));
      });
      return dbPromise;
    }

    function tx(storeName, mode, run) {
      return openDB().then(
        (db) =>
          new Promise((resolve, reject) => {
            const transaction = db.transaction(storeName, mode);
            const request = run(transaction.objectStore(storeName));
            transaction.onerror = () => reject(transaction.error);
            transaction.onabort = () => reject(transaction.error);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
          })
      );
    }

    async function guard(storeName, mode, run, memoryFallback) {
      if (useMemory) return memoryFallback();
      try {
        return await tx(storeName, mode, run);
      } catch (err) {
        console.warn('IndexedDB が使えないためメモリ保存に切り替えます:', err);
        useMemory = true;
        return memoryFallback();
      }
    }

    return {
      all(storeName) {
        return guard(
          storeName,
          'readonly',
          (store) => store.getAll(),
          () => Array.from(memory.get(storeName).values())
        );
      },
      put(storeName, doc) {
        return guard(
          storeName,
          'readwrite',
          (store) => store.put(doc),
          () => {
            memory.get(storeName).set(doc.id, doc);
            return doc.id;
          }
        ).then(() => doc);
      },
      remove(storeName, id) {
        return guard(
          storeName,
          'readwrite',
          (store) => store.delete(id),
          () => memory.get(storeName).delete(id)
        );
      },
    };
  }

  const backend = createLocalBackend();

  /* ---- リポジトリ（アプリが直接触るのはここだけ） ---- */

  const closetRepo = {
    async list() {
      const items = await backend.all(STORE_CLOSET);
      return items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    },
    async listByCategory(category) {
      const items = await this.list();
      return items.filter((item) => item.category === category);
    },
    async add(input) {
      const item = {
        id: newId(),
        userId: CURRENT_USER_ID,
        category: input.category,
        name: input.name,
        imageUrl: input.imageUrl || null,
        colorClass: input.colorClass || 'bg-gray-100',
        warmth: input.warmth,
        formality: input.formality,
        rainSafe: input.rainSafe !== false,
        createdAt: Date.now(),
      };
      return backend.put(STORE_CLOSET, item);
    },
    remove(id) {
      return backend.remove(STORE_CLOSET, id);
    },
  };

  const scheduleRepo = {
    async listByDate(dateKey) {
      const all = await backend.all(STORE_SCHEDULES);
      return all
        .filter((item) => item.date === dateKey)
        .sort((a, b) => {
          // 「終日」は時刻より前に並べる
          if (a.time === b.time) return (a.createdAt || 0) - (b.createdAt || 0);
          if (a.time === '終日') return -1;
          if (b.time === '終日') return 1;
          return a.time.localeCompare(b.time);
        });
    },
    /** カレンダーの点表示用：予定が1件以上ある日付キーの Set */
    async datesWithSchedule() {
      const all = await backend.all(STORE_SCHEDULES);
      return new Set(all.map((item) => item.date));
    },
    add(dateKey, { time, title }) {
      return backend.put(STORE_SCHEDULES, {
        id: newId(),
        userId: CURRENT_USER_ID,
        date: dateKey,
        time: time || '終日',
        title,
        createdAt: Date.now(),
      });
    },
    remove(id) {
      return backend.remove(STORE_SCHEDULES, id);
    },
  };

  const outfitRepo = {
    async findByDate(dateKey) {
      const all = await backend.all(STORE_OUTFITS);
      return all.find((item) => item.date === dateKey) || null;
    },
    async save(dateKey, outfit) {
      const existing = await this.findByDate(dateKey);
      return backend.put(STORE_OUTFITS, {
        id: existing ? existing.id : newId(),
        userId: CURRENT_USER_ID,
        date: dateKey,
        topsId: outfit.tops ? outfit.tops.id : null,
        bottomsId: outfit.bottoms ? outfit.bottoms.id : null,
        shoesId: outfit.shoes ? outfit.shoes.id : null,
        decidedAt: Date.now(),
      });
    },
  };

  /** 初回起動時のサンプルデータ投入 */
  const SEED_ITEMS = [
    { category: 'tops', name: '白のオーバーサイズT', colorClass: 'bg-slate-100', warmth: 1, formality: 1, rainSafe: true },
    { category: 'tops', name: 'ストライプシャツ', colorClass: 'bg-blue-100', warmth: 2, formality: 2, rainSafe: true },
    { category: 'tops', name: '黒ニット', colorClass: 'bg-stone-800', warmth: 4, formality: 2, rainSafe: true },
    { category: 'bottoms', name: 'インディゴデニム', colorClass: 'bg-blue-800', warmth: 3, formality: 1, rainSafe: true },
    { category: 'bottoms', name: '黒テーパードスラックス', colorClass: 'bg-zinc-800', warmth: 3, formality: 3, rainSafe: true },
    { category: 'shoes', name: '白レザースニーカー', colorClass: 'bg-gray-50', warmth: 2, formality: 2, rainSafe: true },
    { category: 'shoes', name: '黒レザーブーツ', colorClass: 'bg-stone-900', warmth: 4, formality: 3, rainSafe: true },
    { category: 'shoes', name: 'キャンバススニーカー', colorClass: 'bg-amber-100', warmth: 2, formality: 1, rainSafe: false },
  ];

  async function seedIfEmpty() {
    const existing = await closetRepo.list();
    if (existing.length > 0) return;
    for (const item of SEED_ITEMS) {
      await closetRepo.add(item);
    }
  }

  /* ============================================================
     2. アプリ状態
     ============================================================ */

  const today = new Date();
  const TODAY_KEY = toDateKey(today);

  const state = {
    todayKey: TODAY_KEY,
    selectedDateKey: TODAY_KEY,   // カレンダーで選択中の日
    calYear: today.getFullYear(),
    calMonth: today.getMonth(),   // 0 = 1月
    activeTab: 'tops',
    weather: null,                // { temp, code, text, icon, color, pop, locationName } | null
    weatherError: null,           // 取得失敗時のメッセージ
    currentOutfit: null,          // 直近のガチャ結果
    pendingPhoto: null,           // 撮影済みで未保存の画像 (data URL)
  };

  /* ============================================================
     3. 天気
     ============================================================ */

  const DEFAULT_LOCATION = { lat: 33.9189, lon: 133.1818, name: '西条市' }; // 愛媛県西条市

  function parseWmoWeatherCode(code) {
    if (code === 0) return { text: '晴れ', icon: 'sun', color: 'text-orange-500' };
    if (code >= 1 && code <= 3) return { text: '晴れ時々曇り', icon: 'cloud-sun', color: 'text-amber-500' };
    if (code === 45 || code === 48) return { text: '霧', icon: 'cloud-fog', color: 'text-slate-400' };
    if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return { text: '雨', icon: 'cloud-rain', color: 'text-blue-500' };
    if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return { text: '雪', icon: 'snowflake', color: 'text-cyan-400' };
    if (code >= 95) return { text: '雷雨', icon: 'cloud-lightning', color: 'text-purple-600' };
    return { text: '曇り', icon: 'cloud', color: 'text-gray-500' };
  }

  /** 現在時刻に対応する降水確率を hourly.time と突き合わせて取り出す */
  function pickPrecipitationProbability(data) {
    const hourly = data.hourly;
    if (!hourly || !Array.isArray(hourly.time) || !Array.isArray(hourly.precipitation_probability)) {
      return null;
    }
    const currentTime = data.current_weather && data.current_weather.time;
    let index = currentTime ? hourly.time.indexOf(currentTime) : -1;
    if (index === -1) {
      // current_weather.time が hourly に無い場合はローカル現在時刻で近似する
      const nowKey = toDateKey(new Date()) + 'T' + String(new Date().getHours()).padStart(2, '0') + ':00';
      index = hourly.time.indexOf(nowKey);
    }
    if (index === -1) return null;
    const value = hourly.precipitation_probability[index];
    // 0% は正当な値なので ?? を使う（|| だと 0 が握り潰される）
    return value ?? null;
  }

  async function fetchWeatherData(lat, lon, locationName) {
    const weatherDesc = $('weather-desc');
    weatherDesc.textContent = `${locationName}: 取得中...`;

    const url =
      'https://api.open-meteo.com/v1/forecast' +
      `?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}` +
      '&current_weather=true&hourly=precipitation_probability&timezone=auto';

    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`天気APIが ${response.status} を返しました`);

      const data = await response.json();
      if (!data || !data.current_weather) throw new Error('天気APIのレスポンスが不正です');

      const info = parseWmoWeatherCode(data.current_weather.weathercode);
      state.weather = {
        temp: Math.round(data.current_weather.temperature),
        code: data.current_weather.weathercode,
        text: info.text,
        icon: info.icon,
        color: info.color,
        pop: pickPrecipitationProbability(data),
        locationName,
      };
      state.weatherError = null;
    } catch (err) {
      // 取得に失敗したときに架空の気温を表示しない。
      // 誤ったコーデ提案の原因になるため、失敗は失敗として扱う。
      console.error('天気データの取得に失敗しました:', err);
      state.weather = null;
      state.weatherError = '天気を取得できません';
    }

    renderWeather();
  }

  function renderWeather() {
    const tempEl = $('weather-temp');
    const descEl = $('weather-desc');
    const iconEl = $('weather-icon-container');

    if (!state.weather) {
      tempEl.textContent = '--°';
      descEl.textContent = state.weatherError || '天気取得中...';
      // className を丸ごと上書きすると shrink-0 が消えてレイアウトが崩れるため、両方指定する
      iconEl.className = 'shrink-0 text-gray-400';
      iconEl.replaceChildren(h('i', { 'data-lucide': 'cloud-off', class: 'w-6 h-6' }));
      lucide.createIcons();
      return;
    }

    const { temp, text, icon, color, pop, locationName } = state.weather;
    tempEl.textContent = `${temp}°`;
    descEl.textContent =
      pop === null ? `${locationName}: ${text}` : `${locationName}: ${text} / 降水 ${pop}%`;
    iconEl.className = `shrink-0 ${color}`;
    // アイコンサイズは初期表示と揃える（w-6）。揃えないと取得後にガタつく
    iconEl.replaceChildren(h('i', { 'data-lucide': icon, class: 'w-6 h-6' }));
    lucide.createIcons();
  }

  /**
   * 天気を取得する。
   * @param {boolean} isUserAction ユーザー操作起点か（起動時の自動取得では位置情報を要求しない）
   */
  function loadWeather(isUserAction = false) {
    if (!isUserAction || !('geolocation' in navigator)) {
      // 初回は既定地点で取得する。いきなり位置情報ダイアログを出さない。
      return fetchWeatherData(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name);
    }

    $('weather-desc').textContent = '位置情報を確認中...';

    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const { latitude, longitude } = position.coords;
        const name = await reverseGeocode(latitude, longitude);
        fetchWeatherData(latitude, longitude, name);
      },
      (error) => {
        console.warn('位置情報が取得できないため既定地点を使用します:', error.message);
        fetchWeatherData(DEFAULT_LOCATION.lat, DEFAULT_LOCATION.lon, DEFAULT_LOCATION.name);
      },
      { timeout: 8000, maximumAge: 10 * 60 * 1000 }
    );
  }

  async function reverseGeocode(lat, lon) {
    try {
      const res = await fetch(
        `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ja`
      );
      if (!res.ok) return '現在地';
      const data = await res.json();
      return data.city || data.locality || data.principalSubdivision || '現在地';
    } catch (err) {
      return '現在地';
    }
  }

  /* ============================================================
     4. ガチャ抽選エンジン
     --------------------------------------------------------
     気温・降水確率・その日の予定から各アイテムにスコアを付け、
     スコアを重みにした加重ランダムで1点ずつ引く。
     決定論的に「最適解」を出すのではなく、ふさわしい服が出やすい
     "ガチャ" として成立させるのが狙い。
     ============================================================ */

  /** 気温から必要な生地の厚み(1-5)を求める */
  function targetWarmthFor(temp) {
    if (temp >= 28) return 1;
    if (temp >= 23) return 2;
    if (temp >= 17) return 3;
    if (temp >= 10) return 4;
    return 5;
  }

  const FORMAL_KEYWORDS = ['仕事', '会議', '打ち合わせ', '面接', '商談', '式', '式典', '結婚式', '葬儀', 'プレゼン', '出社', '面談'];
  const SMART_KEYWORDS = ['デート', 'ディナー', '食事', 'ランチ', '観劇', 'パーティ', '飲み会', 'お出かけ', 'カフェ'];

  /** その日の予定から必要なきれいめ度(1-3)を求める */
  function targetFormalityFor(schedules) {
    let level = 1;
    for (const item of schedules) {
      const title = item.title || '';
      if (FORMAL_KEYWORDS.some((word) => title.includes(word))) return 3;
      if (SMART_KEYWORDS.some((word) => title.includes(word))) level = Math.max(level, 2);
    }
    return level;
  }

  function scoreItem(item, context) {
    let score = 10;
    if (context.targetWarmth !== null) {
      score -= Math.abs(item.warmth - context.targetWarmth) * 2.5;
    }
    score -= Math.abs(item.formality - context.targetFormality) * 1.5;
    if (context.rainy && item.rainSafe === false) score -= 4;
    // 0 にしないことで「たまに意外な組み合わせが出る」ガチャ性を残す
    return Math.max(0.2, score);
  }

  function weightedPick(items, context) {
    const weights = items.map((item) => scoreItem(item, context));
    const total = weights.reduce((sum, weight) => sum + weight, 0);
    let threshold = Math.random() * total;
    for (let i = 0; i < items.length; i++) {
      threshold -= weights[i];
      if (threshold <= 0) return items[i];
    }
    return items[items.length - 1];
  }

  function buildGachaMessage(context, missing) {
    if (missing.length > 0) {
      return `クローゼットに${missing.join('・')}が登録されていません。右上の「＋」から追加すると、完全なコーデを提案できます。`;
    }

    const parts = [];
    if (context.temp === null) {
      parts.push('天気を取得できなかったので、気温は考慮せずに選びました');
    } else {
      const warmthWord =
        context.targetWarmth <= 1 ? '涼しく過ごせる薄手' :
        context.targetWarmth === 2 ? '軽めの' :
        context.targetWarmth === 3 ? '過ごしやすい' :
        context.targetWarmth === 4 ? '暖かめの' : 'しっかり防寒できる';
      parts.push(`今日は${context.temp}°なので、${warmthWord}アイテムを選びました`);
    }

    if (context.rainy) {
      parts.push(`降水確率が${context.pop}%なので、雨に強いものを優先しています`);
    }

    if (context.targetFormality === 3) {
      parts.push('かしこまった予定があるので、フォーマル寄りにまとめました');
    } else if (context.targetFormality === 2) {
      parts.push('お出かけの予定に合わせて、少しきれいめにしています');
    }

    return parts.join('。') + '。';
  }

  /**
   * ガチャを1回引く。
   * @returns {{ tops, bottoms, shoes, message, missing }}
   */
  async function drawOutfit() {
    const [items, schedules] = await Promise.all([
      closetRepo.list(),
      scheduleRepo.listByDate(state.todayKey),
    ]);

    const temp = state.weather ? state.weather.temp : null;
    const pop = state.weather ? state.weather.pop : null;
    const context = {
      temp,
      pop,
      targetWarmth: temp === null ? null : targetWarmthFor(temp),
      targetFormality: targetFormalityFor(schedules),
      rainy: pop !== null && pop >= 50,
    };

    const byCategory = {
      tops: items.filter((item) => item.category === 'tops'),
      bottoms: items.filter((item) => item.category === 'bottoms'),
      shoes: items.filter((item) => item.category === 'shoes'),
    };

    const labels = { tops: 'トップス', bottoms: 'ボトムス', shoes: 'シューズ' };
    const missing = Object.keys(byCategory)
      .filter((key) => byCategory[key].length === 0)
      .map((key) => labels[key]);

    return {
      tops: byCategory.tops.length ? weightedPick(byCategory.tops, context) : null,
      bottoms: byCategory.bottoms.length ? weightedPick(byCategory.bottoms, context) : null,
      shoes: byCategory.shoes.length ? weightedPick(byCategory.shoes, context) : null,
      message: buildGachaMessage(context, missing),
      missing,
    };
  }

  /* ============================================================
     5. 画面遷移（スタック管理）
     --------------------------------------------------------
     以前は closeXxx() が必ずホームへ戻っていたため、
     「結果 → ショップ → 戻る」で提案結果が消えていた。
     スタックで管理して必ず直前の画面へ戻す。
     ============================================================ */

  const screenStack = ['home-screen'];

  function setScreenVisible(id, visible) {
    const el = $(id);
    if (!el) return;
    el.classList.toggle('hidden', !visible);
    // 非表示の画面がフォーカスや読み上げを奪わないようにする
    if (visible) {
      el.removeAttribute('inert');
      el.removeAttribute('aria-hidden');
    } else {
      el.setAttribute('inert', '');
      el.setAttribute('aria-hidden', 'true');
    }
  }

  function currentScreen() {
    return screenStack[screenStack.length - 1];
  }

  function navigateTo(id) {
    if (currentScreen() === id) return;
    setScreenVisible(currentScreen(), false);
    screenStack.push(id);
    setScreenVisible(id, true);
    lucide.createIcons();
  }

  function navigateBack() {
    if (screenStack.length <= 1) return;
    const leaving = screenStack.pop();
    setScreenVisible(leaving, false);
    setScreenVisible(currentScreen(), true);
    onScreenEnter(currentScreen());
    lucide.createIcons();
  }

  function onScreenEnter(id) {
    if (id === 'home-screen') {
      refreshHomeWidget();
    }
  }

  /* ============================================================
     6. トースト
     ============================================================ */

  let toastTimer = null;

  function showToast(message, iconName = 'check-circle-2', iconColor = 'text-green-400') {
    const toast = $('toast-message');
    const icon = $('toast-icon');
    $('toast-text').textContent = message;

    icon.replaceChildren();
    icon.className = `w-5 h-5 ${iconColor}`;
    icon.setAttribute('data-lucide', iconName);

    // 連打時にアニメーションを確実に再生し直す
    clearTimeout(toastTimer);
    toast.classList.remove('animate-toast');
    toast.classList.remove('hidden');
    void toast.offsetWidth; // reflow を強制してアニメーションをリスタート
    toast.classList.add('animate-toast');
    lucide.createIcons();

    toastTimer = setTimeout(() => {
      toast.classList.remove('animate-toast');
      toast.classList.add('hidden');
      toastTimer = null;
    }, 3000);
  }

    const dateEl = $('home-calendar-date-text');
    const scheduleEl = $('home-schedule-text');
    const badgeEl = $('home-decided-badge');

    const date = fromDateKey(state.todayKey);
    dateEl.textContent = `${date.getMonth() + 1}/${date.getDate()} (${WEEKDAYS[date.getDay()]})`;

    // ホームは常に「今日」を出す（カレンダーで別の日を選んでも変わらない）
    const schedules = await scheduleRepo.listByDate(state.todayKey);

      scheduleEl.textContent = '予定なし';
    } else {
      const first = schedules[0];
      const suffix = schedules.length > 1 ? ` 他${schedules.length - 1}件` : '';
      scheduleEl.textContent =
        (first.time === '終日' ? '終日 ' : `${first.time}〜 `) + first.title + suffix;
    }

    // コーデ決定済みバッジは予定テキストとは別要素にする（上書きして壊さない）
    const decided = await outfitRepo.findByDate(state.todayKey);
    badgeEl.classList.toggle('hidden', !decided);
    badgeEl.classList.toggle('flex', !!decided);

    state.activeTab = tabId;
    for (const tab of ['tops', 'bottoms', 'shoes']) {

      const panel = $(`content-${tab}`);

      button.classList.toggle('border-gray-900', active);
      button.classList.toggle('text-gray-900', active);
      button.classList.toggle('border-transparent', !active);

  /* ============================================================
     10. 描画：カレンダーと予定
     ============================================================ */

  async function renderCalendar() {
    const grid = $('calendar-days-grid');
    $('calendar-month-label').textContent = `${state.calYear}年 ${state.calMonth + 1}月`;
    grid.replaceChildren();

    const firstWeekday = new Date(state.calYear, state.calMonth, 1).getDay();
    const daysInMonth = new Date(state.calYear, state.calMonth + 1, 0).getDate();
    const scheduledDates = await scheduleRepo.datesWithSchedule();

    for (let i = 0; i < firstWeekday; i++) {
      grid.appendChild(h('div', { class: 'h-10' }));
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dateKey = `${state.calYear}-${String(state.calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      const isSelected = dateKey === state.selectedDateKey;
      const isToday = dateKey === state.todayKey;
      const hasSchedule = scheduledDates.has(dateKey);

      let className = 'h-10 rounded-xl flex flex-col items-center justify-center relative transition-all active:scale-90 ';
      if (isSelected) className += 'bg-rose-500 text-white font-bold shadow-md';
      else if (isToday) className += 'bg-rose-50 text-rose-600 font-bold ring-1 ring-rose-200';
      else className += 'hover:bg-gray-100 text-gray-700 font-medium';

      const button = h('button', {
        type: 'button',
        class: className,
        'data-action': 'select-date',
        'data-date': dateKey,
        'aria-label': formatDateKeyJa(dateKey),
        'aria-current': isToday ? 'date' : null,
      }, h('span', { class: 'pointer-events-none', text: String(day) }));

      if (hasSchedule) {
        button.appendChild(
          h('span', {
            class: `w-1.5 h-1.5 rounded-full absolute bottom-1 pointer-events-none ${isSelected ? 'bg-white' : 'bg-rose-500'}`,
          })
        );
      }
      grid.appendChild(button);
    }
  }

    titleEl.replaceChildren(
      h('i', { 'data-lucide': 'calendar', class: 'w-4 h-4 text-rose-500' }),
      document.createTextNode(` ${formatDateKeyJa(state.selectedDateKey)} の予定`)
    );

    const schedules = await scheduleRepo.listByDate(state.selectedDateKey);
    $('schedule-count-badge').textContent = `${schedules.length}件`;

        h('input', { type: 'text', maxlength: '60', placeholder: '例: ランチ、ショッピング', 'aria-label': '予定の内容', class: 'schedule-title-input flex-1 min-w-0 border border-gray-200 rounded-xl px-3 py-2 text-xs text-gray-800 focus:outline-none focus:border-rose-400 bg-gray-50' }),
        h('button', { 'data-action': 'remove-input-row', 'data-row-id': rowId, title: '削除', 'aria-label': '入力欄を削除', class: 'text-gray-400 hover:text-rose-500 p-1 rounded-lg transition-colors shrink-0' },
          h('i', { 'data-lucide': 'minus-circle', class: 'w-4 h-4 pointer-events-none' })
        )
      )

    addScheduleInputRow();

  function removeScheduleInputRow(rowId) {
    const container = $('schedule-inputs-container');
    const rows = container.querySelectorAll('.schedule-input-row');
    const row = container.querySelector(`[data-row-id="${CSS.escape(rowId)}"]`);
    if (!row) return;

    if (rows.length > 1) {
      row.remove();
    } else {
      const titleInput = row.querySelector('.schedule-title-input');
      if (titleInput) titleInput.value = '';
    }
  }

  async function addSchedules() {
    const rows = $('schedule-inputs-container').querySelectorAll('.schedule-input-row');
    let added = 0;

    for (const row of rows) {
      const title = row.querySelector('.schedule-title-input').value.trim();
      const time = row.querySelector('.schedule-time-input').value.trim();
      if (!title) continue;
      await scheduleRepo.add(state.selectedDateKey, { time: time || '終日', title });
      added++;
    }

    if (added === 0) {
      showToast('予定の内容を入力してください', 'alert-circle', 'text-amber-400');
      return;
    }

    resetScheduleInputRows();
    await Promise.all([renderCalendar(), renderSchedules(), refreshHomeWidget()]);
    showToast(`${added}件の予定を追加しました`);
  }

  /* ============================================================
     11. ガチャ操作
     ============================================================ */

  let gachaRunning = false;

  function setGachaSpinning(spinning) {
    const button = $('gacha-btn');
    button.disabled = spinning;
    button.classList.toggle('hover:scale-105', !spinning);
    button.classList.toggle('animate-pulse-slow', !spinning);
    button.classList.toggle('animate-spin-slow', spinning);
    button.classList.toggle('opacity-90', spinning);

    $('icon-wand').classList.toggle('hidden', spinning);
    $('icon-spinner').classList.toggle('hidden', !spinning);
    $('gacha-text').textContent = spinning ? 'Thinking...' : 'コーデガチャ';
    $('gacha-subtext').classList.toggle('hidden', spinning);
  }

  const GACHA_SPIN_MS = 1200;

  async function startGacha() {
    if (gachaRunning) return;
    gachaRunning = true;
    setGachaSpinning(true);

    try {
      // 抽選と演出を並行させる（演出だけ待って結果が固定、という状態にしない）
      const [outfit] = await Promise.all([
        drawOutfit(),
        new Promise((resolve) => setTimeout(resolve, GACHA_SPIN_MS)),
      ]);

      state.currentOutfit = outfit;
      renderResult(outfit);
      navigateTo('result-screen');
    } catch (err) {
      console.error('コーデの抽選に失敗しました:', err);
      showToast('コーデを作成できませんでした', 'alert-circle', 'text-amber-400');
    } finally {
      setGachaSpinning(false);
      gachaRunning = false;
    }
  }

  /** 結果画面の「やり直す」：ホームを経由せず、その場で引き直す */
  async function regacha() {
    if (gachaRunning) return;
    gachaRunning = true;

    const message = $('result-message');
    const items = $('result-items');
    message.textContent = '選び直しています...';
    items.classList.add('opacity-40');

    try {
      const [outfit] = await Promise.all([
        drawOutfit(),
        new Promise((resolve) => setTimeout(resolve, 400)),
      ]);
      state.currentOutfit = outfit;
      renderResult(outfit);
    } catch (err) {
      console.error('コーデの抽選に失敗しました:', err);
      showToast('コーデを作成できませんでした', 'alert-circle', 'text-amber-400');
    } finally {
      items.classList.remove('opacity-40');
      gachaRunning = false;
    }
  }

  async function decideOutfit() {
    if (!state.currentOutfit) return;
    try {
      await outfitRepo.save(state.todayKey, state.currentOutfit);
      showToast('今日のコーデを決定しました！');
    } catch (err) {
      console.error('コーデの保存に失敗しました:', err);
      showToast('保存できませんでした', 'alert-circle', 'text-amber-400');
    }
    navigateBack();
  }

  function showCameraError(message) {
    $('camera-error-text').textContent = message;
    $('camera-error').classList.remove('hidden');

    $('camera-error').classList.add('hidden');

  async function openCamera() {
    navigateTo('camera-screen');
    hideCameraError();
    hideCaptureForm();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCameraError('この環境ではカメラを利用できません。https:// または localhost で開いているかご確認ください。');
      return;
    }

    try {
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false,
      });
      $('camera-video').srcObject = currentStream;
    } catch (err) {
      console.error('カメラの起動に失敗しました:', err);
      // 以前は console だけで、ユーザーには真っ黒な画面しか見えなかった
      const messages = {
        NotAllowedError: 'カメラの使用が許可されていません。ブラウザの設定でカメラを許可してください。',
        NotFoundError: '利用できるカメラが見つかりませんでした。',
        NotReadableError: '他のアプリがカメラを使用中の可能性があります。',
      };
      showCameraError(messages[err.name] || `カメラを起動できませんでした（${err.name || 'エラー'}）`);
    }
  }

  function stopCameraStream() {
    if (!currentStream) return;
    currentStream.getTracks().forEach((track) => track.stop());
    currentStream = null;
    $('camera-video').srcObject = null;
  }

  function closeCamera() {
    stopCameraStream();
    hideCaptureForm();
    state.pendingPhoto = null;
    navigateBack();
  }

  /** 撮影画像を長辺 MAX_IMAGE_SIZE に縮小する。
   *  原寸のままだと数MBの data URL になり、保存も同期もできなくなる。 */
  const MAX_IMAGE_SIZE = 800;
  const JPEG_QUALITY = 0.8;

  function captureResizedDataUrl(video) {
    const width = video.videoWidth || 640;
    const height = video.videoHeight || 480;
    const scale = Math.min(1, MAX_IMAGE_SIZE / Math.max(width, height));

    const canvas = $('camera-canvas');
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', JPEG_QUALITY);
  }

  function flashCamera() {
    const flash = $('camera-flash');
    flash.style.transition = 'none';
    flash.classList.replace('opacity-0', 'opacity-100');
    setTimeout(() => {
      flash.style.transition = 'opacity 0.3s ease-out';
      flash.classList.replace('opacity-100', 'opacity-0');
    }, 50);
  }

  function showCaptureForm(dataUrl) {
    $('capture-preview').src = dataUrl;
    $('capture-name').value = '';
    $('capture-category').value = state.activeTab;
    $('capture-warmth').value = '3';
    $('capture-formality').value = '1';
    $('capture-rainsafe').checked = true;
    $('capture-form').classList.remove('hidden');
    $('capture-form').classList.add('flex');
    lucide.createIcons();
  }

  function hideCaptureForm() {
    $('capture-form').classList.add('hidden');
    $('capture-form').classList.remove('flex');
  }

  function takePhoto() {
    if (!currentStream) return;
    flashCamera();
    state.pendingPhoto = captureResizedDataUrl($('camera-video'));
    showCaptureForm(state.pendingPhoto);
  }

  async function saveCapturedItem() {
    if (!state.pendingPhoto) return;

    const name = $('capture-name').value.trim();
    if (!name) {
      showToast('アイテム名を入力してください', 'alert-circle', 'text-amber-400');
      $('capture-name').focus();
      return;
    }

    try {
      // TODO(firebase): data URL のかわりに Cloud Storage へアップロードし
      //                 downloadURL を imageUrl に入れる
      await closetRepo.add({
        category: $('capture-category').value,
        name,
        imageUrl: state.pendingPhoto,
        warmth: parseInt($('capture-warmth').value, 10),
        formality: parseInt($('capture-formality').value, 10),
        rainSafe: $('capture-rainsafe').checked,
      });
    } catch (err) {
      console.error('アイテムの保存に失敗しました:', err);
      showToast('保存できませんでした', 'alert-circle', 'text-amber-400');
      return;
    }

    state.pendingPhoto = null;
    switchTab($('capture-category').value);
    await renderCloset();
    closeCamera();
    showToast(`「${name}」を追加しました`);
  }

  async function deleteClosetItem(id) {
    await closetRepo.remove(id);
    const card = document.querySelector(`[data-item-card="${CSS.escape(id)}"]`);
    if (card) {
      card.classList.add('transition-all', 'duration-200', 'scale-90', 'opacity-0');
      setTimeout(() => renderCloset(), 200);
    } else {
      await renderCloset();
    }
  }

  /* ============================================================
     13. イベント処理（インライン onclick を廃止）
     --------------------------------------------------------
     すべて data-action によるイベント委譲。
     これにより将来 CSP で unsafe-inline を外せる。
     ============================================================ */

  const actions = {
    'open-calendar': async () => {
      navigateTo('calendar-screen');
      state.selectedDateKey = state.todayKey;
      state.calYear = fromDateKey(state.todayKey).getFullYear();
      state.calMonth = fromDateKey(state.todayKey).getMonth();
      resetScheduleInputRows();
      await Promise.all([renderCalendar(), renderSchedules()]);
    },
    'refresh-weather': () => loadWeather(true),
    'start-gacha': () => startGacha(),
    'regacha': () => regacha(),
    'decide-outfit': () => decideOutfit(),
    'open-closet': async () => {
      navigateTo('closet-screen');
      await renderCloset();
    },
    'open-shop': () => navigateTo('shop-screen'),
    'open-camera': () => openCamera(),
    'close-camera': () => closeCamera(),
    'take-photo': () => takePhoto(),
    'cancel-capture': () => {
      state.pendingPhoto = null;
      hideCaptureForm();
    },
    'save-capture': () => saveCapturedItem(),
    'back': () => navigateBack(),
    'switch-tab': (el) => switchTab(el.dataset.tab),
    'delete-item': (el) => deleteClosetItem(el.dataset.id),
    'change-month': (el) => {
      const delta = parseInt(el.dataset.delta, 10);
      const date = new Date(state.calYear, state.calMonth + delta, 1);
      state.calYear = date.getFullYear();
      state.calMonth = date.getMonth();
      return renderCalendar();
    },
    'select-date': async (el) => {
      state.selectedDateKey = el.dataset.date;
      resetScheduleInputRows();
      await Promise.all([renderCalendar(), renderSchedules()]);
    },
    'add-input-row': () => addScheduleInputRow(),
    'remove-input-row': (el) => removeScheduleInputRow(el.dataset.rowId),
    'add-schedules': () => addSchedules(),
    'delete-schedule': async (el) => {
      await scheduleRepo.remove(el.dataset.id);
      await Promise.all([renderCalendar(), renderSchedules(), refreshHomeWidget()]);
    },
  };

  // 画像の読み込み失敗を委譲で処理する（error はバブルしないので capture フェーズで拾う）
  document.addEventListener(
    'error',
    (event) => {
      const img = event.target;
      if (!(img instanceof HTMLImageElement)) return;
      const fallback = img.dataset.fallback;
      if (!fallback || img.src === fallback) return;
      img.src = fallback;
    },
    true
  );

  document.addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const handler = actions[target.dataset.action];
    if (!handler) return;
    event.preventDefault();
    Promise.resolve(handler(target)).catch((err) => {
      console.error(`アクション "${target.dataset.action}" の実行に失敗しました:`, err);
      showToast('処理に失敗しました', 'alert-circle', 'text-amber-400');
    });
  });

  // Esc キーで直前の画面に戻る
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape') return;
    if (currentScreen() === 'camera-screen') closeCamera();
    else navigateBack();
  });

  /* ============================================================
     14. 初期化
     ============================================================ */

  async function init() {
    lucide.createIcons();

    // ホーム以外の画面は最初から inert にしておく
    for (const id of ['result-screen', 'closet-screen', 'shop-screen', 'camera-screen', 'calendar-screen']) {
      setScreenVisible(id, false);
    }

    try {
      await seedIfEmpty();
    } catch (err) {
      console.error('初期データの投入に失敗しました:', err);
    }

    await refreshHomeWidget();
    resetScheduleInputRows();
    loadWeather(false); // 起動時は位置情報を要求しない（既定地点で取得）
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  </script>
</body>
</html>
